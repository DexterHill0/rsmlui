[package]
name = "rsmlui-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rsmlui-sys = { path = "../rsmlui-sys", default-features = false }
rsmlui-macros = { path = "../rsmlui-macros", default-features = false }
drop-tree = { path = "../drop-tree" }

thiserror = "2.0.17"
sealed = "0.6.0"
bon = "3.9.1"
bitflags = "2.11.1"

mint = { version = "0.5.9", optional = true }
glam = { version = "0.33", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }


[features]
default = ["printing", "generate-documentation"]

printing = []

mint = ["dep:mint"]
glam = ["dep:glam"]
bytemuck = ["dep:bytemuck"]

generate-documentation = ["rsmlui-macros/generate-documentation"]
