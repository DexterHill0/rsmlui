[package]
name = "rsmlui-backends"
version = "0.1.0"
edition = "2024"

[dependencies]
rsmlui-sys = { path = "../rsmlui-sys", default-features = false }
rsmlui-core = { path = "../rsmlui-core", default-features = false }

thiserror = "2.0.17"

glfw = { version = "0.63.0", optional = true }
winit = { version = "0.30", optional = true }

[features]
default = []

renderer-gl2 = ["rsmlui-sys/renderer-gl2"]
renderer-gl3 = ["rsmlui-sys/renderer-gl3"]

system-glfw = ["rsmlui-sys/system-glfw"]
system-winit = ["dep:winit"]

freetype = ["rsmlui-sys/freetype"]

glfw-rs = ["dep:glfw"]
